# Capa gold de GamePulse: dbt sobre DuckDB, leyendo la capa silver (Delta en MinIO/S3).
name: gamepulse
version: "1.0.0"
profile: gamepulse

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  gamepulse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: gold
