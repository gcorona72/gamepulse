version: 2

models:
  - name: dim_game
    description: Juegos de Twitch y de Steam, unidos mediante IGDB.
    columns:
      - name: game_key
        description: tw_<id Twitch> o st_<appid> si solo está en Steam.
        data_tests: [unique, not_null]
      - name: in_twitch
        data_tests: [not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_twitch_audience_hourly
    description: Audiencia media y pico por juego y hora.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_key, hour_ts]
    columns:
      - name: game_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game')
                field: game_key
      - name: avg_viewers
        data_tests: [not_null]

  - name: fct_steam_players_hourly
    columns:
      - name: appid
        data_tests: [not_null]
      - name: game_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_game')
                field: game_key

  - name: fct_steam_price_daily
    data_tests:
      - unique_combination:
          arguments:
            columns: [appid, date_day]

  - name: fct_reviews
    columns:
      - name: recommendationid
        data_tests: [unique, not_null]
      - name: voted_up
        data_tests: [not_null]

  - name: mart_twitch_vs_steam_hourly
    description: Audiencia de Twitch y jugadores de Steam por juego y hora (preguntas 1 y 3).

  - name: mart_sale_uplift
    description: >
      Pregunta 2. Una fila por rebaja (días consecutivos con descuento): media de jugadores
      durante la rebaja frente a los 7 días anteriores y subida en porcentaje.
    data_tests:
      - unique_combination:
          arguments:
            columns: [appid, sale_start]
    columns:
      - name: sale_days
        data_tests: [not_null]

  - name: mart_audience_lead
    description: >
      Pregunta 1. Correlación entre espectadores de Twitch en la hora t y jugadores de Steam en
      t + lag_hours (0-12 h), por juego. El lag con la correlación más alta es el adelanto de Twitch.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_key, lag_hours]