name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra spark --extra gold

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Tests unitarios (pytest)
        run: uv run pytest -q

      - name: Modelos dbt válidos (dbt parse, sin datos)
        working-directory: dbt
        run: uv run dbt parse --profiles-dir .

      - name: DAG de Airflow y dashboard sin errores de sintaxis
        run: uv run python -m py_compile airflow/dags/gamepulse_pipeline.py dashboard/app.py
