[project]
name = "gamepulse"
version = "0.1.0"
description = "Plataforma de datos lakehouse para analítica de videojuegos en tiempo real (Twitch + Steam)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.32",
    "confluent-kafka>=2.5",
    "boto3>=1.35",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Solo para el procesamiento (Mac). Los contenedores de ingesta no lo necesitan.
spark = ["pyspark==4.0.1", "delta-spark==4.0.0"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamepulse"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
